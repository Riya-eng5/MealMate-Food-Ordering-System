services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/food_ordering.db
      SECRET_KEY: ${SECRET_KEY:-replace-this-before-deployment}
    ports:
      - "8000:8000"
    volumes:
      - food_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  food_data:
